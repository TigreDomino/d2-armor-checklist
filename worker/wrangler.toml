name = "d2-armor-proxy"
main = "index.js"
compatibility_date = "2026-10-01"

# Riusa lo STESSO namespace KV del Worker attuale, altrimenti i backup
# sincronizzati finora restano nel vecchio namespace e non vengono più letti.
# Trovi l'id con:  wrangler kv namespace list
[[kv_namespaces]]
binding = "SYNC_KV"
id = "fc36d68df95f4004afeaeb5dfe229df7"

[vars]
# Origin aggiuntive ammesse dal CORS (separate da virgola). Utile per test in locale.
# EXTRA_ORIGINS = "http://127.0.0.1:8765,http://localhost:8765"
# Giorni di conservazione dei backup cloud (0 = per sempre).
SYNC_TTL_DAYS = "365"

# Opzionale: rate limiting nativo di Cloudflare (piano paid).
# Se presente il Worker lo usa, altrimenti ricade sul limite in-memory per isolate.
# [[ratelimits]]
# name = "RATE_LIMITER"
# namespace_id = "1001"
# simple = { limit = 240, period = 60 }
